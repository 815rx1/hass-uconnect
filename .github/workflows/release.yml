name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    # Tags such as v0.6.0b1 or v0.6.0rc1 become pre-releases, which HACS only
    # offers to users who enabled beta versions. A release created by hand
    # before the tag is pushed keeps its notes.
    - uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        omitPrereleaseDuringUpdate: true
        generateReleaseNotes: true
        prerelease: ${{ contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
        makeLatest: ${{ !(contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')) }}
